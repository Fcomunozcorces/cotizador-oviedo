<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador Oviedo Ferreterías</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23FF0A00'/><text x='16' y='22' font-size='18' font-weight='900' text-anchor='middle' fill='white'>O</text></svg>">
<style>
:root{--red:#FF0A00;--black:#000;--dark:#1a1a1a;--gray:#666;--lightgray:#f5f5f5;--border:#e5e5e5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:#f8f8f8;color:var(--dark);direction:ltr;text-align:left}
.header{background:#fff;border-bottom:3px solid var(--red);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px #0001;flex-wrap:wrap;gap:8px}
.header img{height:42px}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;color:var(--gray);background:var(--lightgray);padding:3px 10px;border-radius:6px}
input[type=text],input[type=number],input[type=password]{padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;direction:ltr;text-align:left}
input[type=text]:focus,input[type=number]:focus{outline:2px solid var(--red);border-color:transparent}
textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;line-height:1.5}
textarea:focus{outline:2px solid var(--red);border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff}
.btn-black{background:var(--black);color:#fff}
.btn-ghost{background:#fff;color:var(--dark);border:1px solid var(--border)}
.btn-green{background:#16a34a;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.card-body{padding:16px 20px}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 0;border:none;background:transparent;color:var(--gray);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.tab.active{color:var(--red);border-bottom:2px solid var(--red);background:#fff5f5}
.drop-area{padding:30px;text-align:center;border:2px dashed var(--border);border-radius:8px;background:var(--lightgray)}
table{width:100%;border-collapse:collapse}
th{background:var(--black);color:#fff;padding:9px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;text-align:left;white-space:nowrap}
th.r{text-align:right}
th.c{text-align:center}
td{padding:7px 10px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:top}
td.r{text-align:right;font-family:'Courier New',monospace;white-space:nowrap}
td.c{text-align:center}
td.mono{font-family:'Courier New',monospace;font-size:11px;color:var(--gray)}
tr.alt{background:var(--lightgray)}
tr.sel{background:#fff5f5}
tr.clickable{cursor:pointer;transition:background .1s}
tr.clickable:hover{background:#fef2f2}
tr.no-match{background:#fef2f2}
.conf{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
.conf-alta{background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0}
.conf-media{background:#fef9c3;color:#ca8a04;border:1px solid #fde68a}
.conf-baja{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
.note{font-size:10px;color:var(--gray);margin-top:3px;line-height:1.2}
.total-row{background:var(--red)}
.total-row td{color:#fff;font-weight:800;font-size:14px;padding:10px}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cs-card{padding:14px;background:var(--lightgray);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .15s;position:relative}
.cs-card.selected{border:2px solid var(--red);background:#fff5f5}
.cs-card .check{position:absolute;top:8px;right:10px;font-size:16px;color:var(--red)}
.export-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:20px 0}
.container{max-width:1100px;margin:0 auto;padding:16px 20px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.step-text{font-size:13px;margin-left:8px}
.margen-ctrl{display:flex;align-items:center;gap:6px}
.margen-ctrl label{font-size:13px;color:var(--gray)}
.margen-ctrl input{width:62px;text-align:center;font-weight:700;font-size:15px;color:var(--red)}
.admin-overlay{position:fixed;inset:0;background:#000a;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.admin-panel{background:#fff;border-radius:14px;padding:28px;max-width:500px;width:100%;box-shadow:0 20px 60px #0003}
.stat{text-align:center}.stat-num{font-size:24px;font-weight:800;color:var(--red)}.stat-label{font-size:11px;color:var(--gray)}
.hist-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.photo-preview{max-height:160px;border-radius:8px;margin-bottom:12px}
.section-marker{width:4px;height:18px;background:var(--red);border-radius:2px;display:inline-block;margin-right:8px;vertical-align:middle}
/* PDF view */
.pdf-overlay{position:fixed;inset:0;z-index:200;background:#fff;overflow-y:auto}
.pdf-toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:3px solid var(--red);box-shadow:0 2px 8px #0001}
.pdf-body{max-width:800px;margin:0 auto;padding:24px 28px}
@media(max-width:600px){.header{padding:10px 12px}.container{padding:12px}.card-body{padding:12px}th,td{padding:5px 6px;font-size:10px}}
@media print{.pdf-toolbar{display:none!important}.pdf-body{padding:20px!important}}
</style>
</head>

// Registrar ingreso: graba en servidor (Netlify Blobs) + backup local
function logAccess(user){
  const entry={user:user.user,tipo:user.tipo,fecha:new Date().toISOString()};
  // Backup local por resiliencia (si servidor falla)
  const logs=JSON.parse(localStorage.getItem("ov_access_logs")||"[]");
  logs.push(entry);
  localStorage.setItem("ov_access_logs",JSON.stringify(logs));
  // Envío al servidor (no-bloqueante)
  fetch("/.netlify/functions/access-log",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user:user.user,tipo:user.tipo})
  }).catch(e=>console.error("Error enviando log:",e));
}

// Cargar logs centralizados desde el servidor
async function loadServerLogs(){
  loadingLogs=true;render();
  try{
    const r=await fetch("/.netlify/functions/access-log");
    if(!r.ok)throw new Error("HTTP "+r.status);
    serverLogs=await r.json();
  }catch(e){
    console.error("Error cargando logs del servidor:",e);
    serverLogs=false; // false = error, usar fallback local
  }
  loadingLogs=false;render();
}

function getAccessLogs(){
  // Si servidor cargó OK, usar esos (incluyen todos los dispositivos)
  if(Array.isArray(serverLogs))return serverLogs;
  // Si servidor falló o aún no se cargó, usar locales
  return JSON.parse(localStorage.getItem("ov_access_logs")||"[]");
}

function getUserSummary(){
  const logs=getAccessLogs();
  const summary={};
  logs.forEach(l=>{
    if(!summary[l.user])summary[l.user]={count:0,last:""};
    summary[l.user].count++;
    if(!summary[l.user].last||l.fecha>summary[l.user].last)summary[l.user].last=l.fecha;
  });
  return summary;
}

// Logs de un usuario específico, ordenados desc
function getUserLogs(userName){
  return getAccessLogs().filter(l=>l.user===userName).sort((a,b)=>b.fecha.localeCompare(a.fecha));
}

async function exportAccessLogs(){
  // Refrescar desde servidor antes de exportar
  try{
    const r=await fetch("/.netlify/functions/access-log");
    if(r.ok)serverLogs=await r.json();
  }catch{}
  if(!window.XLSX){
    const s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";document.head.appendChild(s);
    await new Promise(r=>{s.onload=r;s.onerror=()=>r();});
  }
  const X=window.XLSX;if(!X)return;
  const logs=getAccessLogs().slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const rows=[["Usuario","Tipo","Fecha","Hora"]];
  logs.forEach(l=>{const d=new Date(l.fecha);rows.push([l.user,l.tipo,d.toLocaleDateString("es-CL"),d.toLocaleTimeString("es-CL")]);});
  const wb=X.utils.book_new();const ws=X.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:15},{wch:15},{wch:15},{wch:12}];
  X.utils.book_append_sheet(wb,ws,"Accesos");
  X.writeFile(wb,`Accesos_Oviedo_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ── Helpers ──
const norm = t => (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").trim();
const tokenize = t => norm(t).split(/\s+/).filter(w=>w.length>1);
const fmt = n => `$${Math.round(n).toLocaleString("es-CL")}`;
const pNet = (c,m) => Math.round(c/(1-m/100));
const pIva = (c,m) => Math.round(pNet(c,m)*(1+IVA));
const getMargen = (key) => rowMargen[key]!==undefined?rowMargen[key]:margen;
const getCsMargen = (i) => csMargen[i]!==undefined?csMargen[i]:margen;
const getDesc = (key) => rowDesc[key]||0;
const getDescM = (key) => rowDescM[key]!==undefined?rowDescM[key]:null;
const getCsDesc = (i) => csDesc[i]||0;
const getCsDescM = (i) => csDescM[i]!==undefined?csDescM[i]:null;
const getCant = (key,def) => rowCant[key]!==undefined?rowCant[key]:def;
const getCsCant = (i) => csCant[i]!==undefined?csCant[i]:1;
// calcLine: if descMontoFixed is set, use it; otherwise use desc%
const calcLine = (costo,m,descPct,descMontoFixed,cant) => {
  const neto=pNet(costo,m);
  const descMonto=descMontoFixed!==null?descMontoFixed:Math.round(neto*descPct/100);
  const descPctEff=neto>0?Math.round(descMonto/neto*100*10)/10:0;
  const netoFinal=neto-descMonto;
  const iva=Math.round(netoFinal*(1+IVA));
  return {neto,descPct:descPctEff,descMonto,netoFinal,iva,totalNeto:netoFinal*cant,totalIva:iva*cant};
};
const P = {SKU:0,DESC:1,MARCA:2,COSTO:3,FAM:4,SUBFAM:5};

// v1.2 — Recálculo parcial sin reconstruir todo el DOM (evita pérdida de foco)
function recalcRow(key){
  let p,cant,m,d,dM,isCs=false;
  if(key.startsWith("m-")){
    const mi=+key.split("-")[1];const mp=manualProds[mi];if(!mp)return;
    p=mp.p;cant=getCant(key,mp.cant||1);m=getMargen(key);d=getDesc(key);dM=getDescM(key);
  }else if(key.startsWith("cs-")){
    const i=+key.split("-")[1];const cs=crossSell[i];if(!cs)return;
    p=cs.p;isCs=true;cant=getCsCant(i);m=getCsMargen(i);d=getCsDesc(i);dM=getCsDescM(i);
  }else{
    const parts=key.split("-").map(Number);const idx=parts[0],ai=parts[1];
    const alt=results?.[idx]?.alternativas?.[ai];if(!alt?.p)return;
    p=alt.p;cant=getCant(key,ai===0?(results[idx].cantidad||1):1);m=getMargen(key);d=getDesc(key);dM=getDescM(key);
  }
  const cl=calcLine(p[P.COSTO],m,d,dM,cant);
  const set=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t;};
  const setInput=(id,v)=>{const el=document.getElementById(id);if(el&&document.activeElement!==el)el.value=v;};
  set(`cell-${key}-neto`,fmt(cl.neto));
  set(`cell-${key}-total`,fmt(cl.totalNeto));
  setInput(`input-${key}-dctoPct`,Math.round(cl.descPct*10)/10);
  setInput(`input-${key}-dctoM`,cl.descMonto);
  recalcTotals();
}

function recalcTotals(){
  let tCosto=0,tNeto=0,tDcto=0,tNetoFinal=0;
  results?.forEach((item,idx)=>{
    if(item.manualResolved)return;
    item.alternativas.forEach((alt,ai)=>{
      const key=idx+"-"+ai;if(!selProd[key]||!alt.p)return;
      const p=alt.p,m=getMargen(key),d=getDesc(key),dM=getDescM(key);
      const cant=getCant(key,ai===0?(item.cantidad||1):1);
      const cl=calcLine(p[P.COSTO],m,d,dM,cant);
      tCosto+=p[P.COSTO]*cant;tNeto+=cl.neto*cant;tDcto+=cl.descMonto*cant;tNetoFinal+=cl.totalNeto;
    });
  });
  manualProds.forEach((mp,mi)=>{
    const key="m-"+mi;if(selProd[key]===false)return;
    const p=mp.p,m=getMargen(key),d=getDesc(key),dM=getDescM(key);
    const cant=getCant(key,mp.cant||1);
    const cl=calcLine(p[P.COSTO],m,d,dM,cant);
    tCosto+=p[P.COSTO]*cant;tNeto+=cl.neto*cant;tDcto+=cl.descMonto*cant;tNetoFinal+=cl.totalNeto;
  });
  let csNetoTotal=0,csCosto=0,csNeto=0,csDcto=0;
  crossSell.forEach((cs,i)=>{
    if(!selCross[i])return;
    const p=cs.p,m=getCsMargen(i),d=getCsDesc(i),dM=getCsDescM(i),cant=getCsCant(i);
    const cl=calcLine(p[P.COSTO],m,d,dM,cant);
    csNetoTotal+=cl.totalNeto;csCosto+=p[P.COSTO]*cant;csNeto+=cl.neto*cant;csDcto+=cl.descMonto*cant;
  });
  const subAntes=tNetoFinal+csNetoTotal;
  const descGM=descGlobalM!==null?descGlobalM:Math.round(subAntes*descGlobalPct/100);
  const grandNeto=subAntes-descGM;
  const grandIva=Math.round(grandNeto*(1+IVA));
  const grandCosto=tCosto+csCosto;
  const grandMargen=grandNeto>0?Math.round((1-grandCosto/grandNeto)*100):0;
  const set=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t;};
  set("st-pCosto",fmt(tCosto));
  set("st-pMargen",(tNetoFinal>0?Math.round((1-tCosto/tNetoFinal)*100):0)+"%");
  set("st-pNeto",fmt(tNeto));
  set("st-pDctoPct",tNeto>0?(Math.round(tDcto/tNeto*1000)/10)+"%":"-");
  set("st-pDcto",tDcto>0?"-"+fmt(tDcto):"-");
  set("st-pTotal",fmt(tNetoFinal));
  set("st-csCosto",fmt(csCosto));
  set("st-csNeto",fmt(csNeto));
  set("st-csDctoPct",csNeto>0?(Math.round(csDcto/csNeto*1000)/10)+"%":"-");
  set("st-csDcto",csDcto>0?"-"+fmt(csDcto):"-");
  set("st-csTotal",fmt(csNetoTotal));
  set("g-margen",grandMargen+"%");
  set("g-subAntes",fmt(subAntes));
  set("g-descGlobal",descGM>0?"-"+fmt(descGM):"-");
  set("g-neto",fmt(grandNeto));
  set("g-iva",fmt(grandIva-grandNeto));
  set("g-iva-total",fmt(grandIva));
  // Sync el input opuesto del dcto global
  const dGPctEff=subAntes>0?Math.round(descGM/subAntes*1000)/10:0;
  const e1=document.getElementById("descGlobalPctInput");if(e1&&document.activeElement!==e1)e1.value=dGPctEff;
  const e2=document.getElementById("descGlobalMInput");if(e2&&document.activeElement!==e2)e2.value=descGM;
}

function resolveManualMatch(idx,sku){
  const prod=products.find(p=>String(p[P.SKU])===String(sku));if(!prod)return;
  manualProds.push({p:prod,cant:results[idx]?.cantidad||1,fromIdx:idx});
  selProd["m-"+(manualProds.length-1)]=true;
  if(results[idx])results[idx].manualResolved=true;
  manualSearchKey="";manualSearchResults=[];render();
}

// v1.2 — Reabrir cotización del historial
function reopenQuote(id){
  const h=hist.find(x=>x.id===id);if(!h||!h.state)return alert("Esta cotización no tiene estado guardado (es de versión anterior).");
  const s=h.state;
  // Reconstruir results desde SKUs
  results=(s.results||[]).map(r=>({...r,alternativas:(r.alternativas||[]).map(a=>{const prod=products.find(p=>String(p[P.SKU])===String(a.sku));return prod?{...a,p:prod}:null;}).filter(Boolean)}));
  crossSell=(s.crossSell||[]).map(c=>{const prod=products.find(p=>String(p[P.SKU])===String(c.sku));return prod?{...c,p:prod}:null;}).filter(Boolean);
  manualProds=(s.manualProds||[]).map(m=>{const prod=products.find(p=>String(p[P.SKU])===String(m.sku));return prod?{p:prod,cant:m.cant,fromIdx:m.fromIdx}:null;}).filter(Boolean);
  sel=s.sel||{};selCross=s.selCross||{};selProd=s.selProd||{};
  rowMargen=s.rowMargen||{};rowDesc=s.rowDesc||{};rowDescM=s.rowDescM||{};rowCant=s.rowCant||{};
  csMargen=s.csMargen||{};csDesc=s.csDesc||{};csDescM=s.csDescM||{};csCant=s.csCant||{};
  margen=s.margen||MARGEN_DEFAULT;
  clienteNombre=s.clienteNombre||"";clienteRut=s.clienteRut||"";clienteEmail=s.clienteEmail||"";clienteTelefono=s.clienteTelefono||"";
  formaPago=s.formaPago||"Contado";plazoEntrega=s.plazoEntrega||"Inmediata";validezDias=s.validezDias||7;notasCliente=s.notasCliente||"";
  descGlobalPct=s.descGlobalPct||0;descGlobalM=s.descGlobalM!==undefined?s.descGlobalM:null;
  folio=h.folio||"";clientText=s.clientText||"";
  showHist=false;render();
  setTimeout(()=>window.scrollTo({top:document.querySelector(".card-body")?.offsetTop||0,behavior:"smooth"}),100);
}

function duplicateQuote(id){
  reopenQuote(id);

  folio="";
  render();
}

function scoreMatch(p,tokens){
  const txt=norm(`${p[1]} ${p[2]} ${p[4]} ${p[5]}`);
  const words=txt.split(/\s+/);
  let score=0,matched=0;
  for(const tk of tokens){if(txt.includes(tk)){matched++;score+=words.includes(tk)?3:1;if(norm(p[1]).includes(tk))score+=2;}}
  return matched>=Math.ceil(tokens.length*0.25)?score*(matched/tokens.length):0;
}

function localSearch(query,max=20){
  const tokens=tokenize(query);
  if(!tokens.length)return[];
  return products.map(p=>[p,scoreMatch(p,tokens)]).filter(([,s])=>s>0).sort((a,b)=>b[1]-a[1]).slice(0,max).map(([p])=>p);
}

// Quick search for add-product (also matches SKU directly)
function quickSearch(query,max=8){
  if(!query||query.length<2)return[];
  const q=query.trim();
  // Exact SKU match first
  const skuMatch=products.filter(p=>String(p[P.SKU]).toLowerCase()===q.toLowerCase());
  if(skuMatch.length)return skuMatch.slice(0,max);
  // SKU starts with
  const skuStarts=products.filter(p=>String(p[P.SKU]).toLowerCase().startsWith(q.toLowerCase())).slice(0,3);
  // Text search
  const textResults=localSearch(q,max);
  // Merge, dedupe
  const seen=new Set();
  const merged=[];
  for(const p of [...skuStarts,...textResults]){
    if(!seen.has(p[P.SKU])){seen.add(p[P.SKU]);merged.push(p);}
    if(merged.length>=max)break;
  }
  return merged;
}

function removeManualProduct(idx){
  const key="m-"+idx;
  delete selProd[key];delete rowMargen[key];delete rowDesc[key];delete rowDescM[key];delete rowCant[key];
  manualProds.splice(idx,1);
  // Re-index keys for products after this one
  const newSelProd={},newRowMargen={},newRowDesc={},newRowCant={};
  Object.entries(selProd).forEach(([k,v])=>{
    if(k.startsWith("m-")){const i=+k.split("-")[1];if(i>idx)newSelProd["m-"+(i-1)]=v;else if(i<idx)newSelProd[k]=v;}else newSelProd[k]=v;
  });
  Object.entries(rowMargen).forEach(([k,v])=>{
    if(k.startsWith("m-")){const i=+k.split("-")[1];if(i>idx)newRowMargen["m-"+(i-1)]=v;else if(i<idx)newRowMargen[k]=v;}else newRowMargen[k]=v;
  });
  Object.entries(rowDesc).forEach(([k,v])=>{
    if(k.startsWith("m-")){const i=+k.split("-")[1];if(i>idx)newRowDesc["m-"+(i-1)]=v;else if(i<idx)newRowDesc[k]=v;}else newRowDesc[k]=v;
  });
  Object.entries(rowCant).forEach(([k,v])=>{
    if(k.startsWith("m-")){const i=+k.split("-")[1];if(i>idx)newRowCant["m-"+(i-1)]=v;else if(i<idx)newRowCant[k]=v;}else newRowCant[k]=v;
  });
  selProd=newSelProd;rowMargen=newRowMargen;rowDesc=newRowDesc;rowCant=newRowCant;
  render();
}

// ── Claude API ──
async function askClaude(system,user){
  const r=await fetch("/.netlify/functions/claude",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:API_MODEL,max_tokens:4000,system,messages:[{role:"user",content:typeof user==="string"?user:user}]})
  });
  const d=await r.json();
  if(d.error){alert("API Error: "+d.error.message);return"";}
  return(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}

function parseJSON(raw){
  try{return JSON.parse(raw.replace(/```json\s*/g,"").replace(/```/g,"").trim());}catch{return null;}
}

// ── Main process ──
async function processQuote(){
  if(!clientText.trim()||busy)return;
  busy=true;results=null;crossSell=[];sel={};selCross={};selProd={};rowMargen={};rowDesc={};rowDescM={};rowCant={};csMargen={};csDesc={};csDescM={};csCant={};manualProds=[];addSearch="";addResults=[];folio="";notasCliente="";descGlobalPct=0;descGlobalM=null;manualSearchKey="";render();

  try{
    stepText="Identificando productos...";render();
    const parsed=parseJSON(await askClaude("Extrae cada producto del texto. JSON sin markdown: [{\"item\":\"desc\",\"cantidad\":n_or_null}]",clientText));
    const items=parsed||clientText.split("\n").filter(l=>l.trim()).map(l=>({item:l.trim(),cantidad:null}));

    stepText=`Buscando en catálogo (${items.length} productos)...`;render();
    const candidates=items.map(ci=>localSearch(ci.item,15));

    stepText="Análisis con IA...";render();
    const matchPrompt=`Eres asistente de cotización de Ferretería Oviedo (Chile).
Para cada producto del cliente, selecciona 1-3 mejores alternativas del catálogo.
Considera medidas, materiales, marcas y specs. Si no hay match razonable, sin_match:true.
RESPONDE SOLO JSON (sin markdown):
[{"cliente_item":"...", "cantidad":n, "alternativas":[{"sku":"...","confianza":"alta|media|baja","nota":"..."}], "sin_match":false}]`;

    const matchUser=`PRODUCTOS DEL CLIENTE:\n${items.map((it,i)=>`${i+1}. ${it.cantidad?it.cantidad+"x ":""}${it.item}`).join("\n")}\n\nCANDIDATOS:\n${candidates.map((cs,i)=>`\n--- #${i+1}: "${items[i].item}" ---\n${cs.map(c=>`SKU:${c[P.SKU]} | ${c[P.DESC]} | ${c[P.MARCA]} | ${c[P.FAM]} | $${c[P.COSTO]}`).join("\n")}`).join("\n")}`;

    const matches=parseJSON(await askClaude(matchPrompt,matchUser));
    if(!matches){alert("Error en análisis. Reintente.");busy=false;stepText="";render();return;}

    results=matches.map(m=>({...m,alternativas:(m.alternativas||[]).map(a=>{const prod=products.find(p=>p[P.SKU]===a.sku);return prod?{...a,p:prod}:null;}).filter(Boolean)}));
    results.forEach((it,i)=>{if(it.alternativas.length){sel[i]=0;selProd[i+"-0"]=true;}});

    // Cross-sell
    stepText="Generando sugerencias...";render();
    const matched=results.flatMap(it=>it.alternativas.map(a=>a.p)).filter(Boolean);
    if(matched.length){
      const matchedSkus=new Set(matched.map(p=>p[P.SKU]));
      const matchedFams=[...new Set(matched.map(p=>p[P.FAM]))];
      const RELATED={"GASFITERIA":["SILICONAS Y SELLANTES","GRIFERIA","FIJACIONES","HERRAMIENTAS MANUALES"],"PINTURA":["HERRAMIENTAS MANUALES","SILICONAS Y SELLANTES","CINTAS ADHESIVAS","QUIMICOS Y PEGAMENTOS"],"ILUMINACION Y ELECTRICIDAD":["HERRAMIENTAS MANUALES","FIJACIONES","CINTAS ADHESIVAS"],"HERRAMIENTAS ELECTRICAS":["ACCESORIOS PARA HERRAMIENTAS","SEGURIDAD","FIJACIONES"],"HERRAMIENTAS INALAMBRICAS":["ACCESORIOS PARA HERRAMIENTAS","SEGURIDAD","FIJACIONES"],"FIJACIONES":["HERRAMIENTAS MANUALES","HERRAMIENTAS ELECTRICAS","SILICONAS Y SELLANTES"],"TABIQUERIA Y REVESTIMIENTO":["FIJACIONES","PINTURA","HERRAMIENTAS MANUALES","SILICONAS Y SELLANTES"],"PISOS":["SILICONAS Y SELLANTES","QUIMICOS Y PEGAMENTOS","HERRAMIENTAS MANUALES"],"C. MATERIALES CONSTRUCCION":["FIJACIONES","HERRAMIENTAS MANUALES","HERRAMIENTAS CONSTRUCCION","SEGURIDAD"],"HERRAMIENTAS MANUALES":["SEGURIDAD","FIJACIONES","HERRAMIENTAS ELECTRICAS"],"SEGURIDAD":["HERRAMIENTAS MANUALES","HERRAMIENTAS ELECTRICAS"],"HERRAMIENTAS CONSTRUCCION":["SEGURIDAD","FIJACIONES","C. MATERIALES CONSTRUCCION"],"SOLDADORAS":["SEGURIDAD","ACCESORIOS PARA HERRAMIENTAS"],"TECHUMBRE Y AISLACION":["FIJACIONES","SILICONAS Y SELLANTES","HERRAMIENTAS MANUALES"],"GRIFERIA":["GASFITERIA","SILICONAS Y SELLANTES"],"ACCESORIOS PARA HERRAMIENTAS":["HERRAMIENTAS ELECTRICAS","HERRAMIENTAS INALAMBRICAS","SEGURIDAD"],"C. MATERIALES FERRETERIA":["FIJACIONES","HERRAMIENTAS MANUALES","SEGURIDAD"],"QUINCALLERIA Y CERRAJERIA":["HERRAMIENTAS MANUALES","FIJACIONES"],"HOGAR":["PINTURA","ILUMINACION Y ELECTRICIDAD"],"BOMBAS Y MOTORES":["GASFITERIA","HERRAMIENTAS MANUALES"],"GENERADORES Y COMPRESORES":["ACCESORIOS PARA HERRAMIENTAS","SEGURIDAD"]};
      const relFams=new Set();matchedFams.forEach(f=>(RELATED[f]||[]).forEach(r=>relFams.add(r)));
      // Fallback: if no related families found, suggest from SEGURIDAD + HERRAMIENTAS MANUALES
      if(relFams.size===0){relFams.add("SEGURIDAD");relFams.add("HERRAMIENTAS MANUALES");relFams.add("FIJACIONES");}
      const csCands=products.filter(p=>!matchedSkus.has(p[P.SKU])&&relFams.has(p[P.FAM])).slice(0,60);
      if(csCands.length){
        const cs=parseJSON(await askClaude("Eres experto en ventas de ferretería en Chile. Sugiere 3-6 complementarios para cross-selling. JSON sin markdown: [{\"sku\":\"...\",\"razon\":\"...\"}]",
          `COMPRANDO:\n${matched.map(p=>`- ${p[P.DESC]} (${p[P.FAM]})`).join("\n")}\n\nDISPONIBLE:\n${csCands.map(p=>`SKU:${p[P.SKU]} | ${p[P.DESC]} | ${p[P.FAM]} | $${p[P.COSTO]}`).join("\n")}`));
        if(cs)crossSell=cs.map(x=>{const prod=products.find(p=>p[P.SKU]===x.sku);return prod?{...x,p:prod}:null;}).filter(Boolean);
      }
    }

    // Save history (con estado completo, solo SKUs para ahorrar localStorage)
    const state={
      clientText,clienteNombre,clienteRut,clienteEmail,clienteTelefono,
      formaPago,plazoEntrega,validezDias,notasCliente,
      descGlobalPct,descGlobalM,margen,
      sel,selCross,selProd,rowMargen,rowDesc,rowDescM,rowCant,csMargen,csDesc,csDescM,csCant,
      results:results.map(r=>({cliente_item:r.cliente_item,cantidad:r.cantidad,sin_match:r.sin_match,manualResolved:r.manualResolved,alternativas:(r.alternativas||[]).map(a=>({sku:a.p?.[P.SKU],confianza:a.confianza,nota:a.nota}))})),
      crossSell:crossSell.map(c=>({sku:c.p?.[P.SKU],razon:c.razon})),
      manualProds:manualProds.map(m=>({sku:m.p?.[P.SKU],cant:m.cant,fromIdx:m.fromIdx}))
    };
    const entry={id:Date.now(),folio:folio||"(sin folio)",fecha:new Date().toLocaleString("es-CL"),vendedor,input:clientText.substring(0,150),items:results.length,matched:results.filter(e=>e.alternativas.length>0).length,state};
    hist=[entry,...hist].slice(0,30); // limit 30 para no saturar localStorage
    try{localStorage.setItem("ov_hist",JSON.stringify(hist));}catch(e){console.error("Historial muy grande, recortando");hist=hist.slice(0,15);localStorage.setItem("ov_hist",JSON.stringify(hist));}

  }catch(err){console.error(err);alert("Error: "+err.message);}
  busy=false;stepText="";render();
}

ng-top:14px;border-top:3px solid #000;display:flex;justify-content:space-between"><div style="font-size:9px;color:#999;line-height:1.7"><div>Cotización válida por ${validezDias} días desde su emisión.</div><div>Precios sujetos a disponibilidad de stock.</div><div>Forma de pago: ${formaPago} · Plazo de entrega: ${plazoEntrega}.</div></div><div style="text-align:right"><div style="font-size:11px;font-weight:800;color:#FF0A00;letter-spacing:1px">WWW.OVIEDO.CL</div><div style="font-size:9px;color:#999;margin-top:2px">Santiago · Las Cabras · San Vicente · El Manzano · Litueche</div></div></div></div><div style="height:6px;background:#000"></div><div style="height:3px;background:#FF0A00"></div><script>window.onload=function(){window.print()}<\/script></body></html>`;

function buildPDFData(){
  const items=[];let totalNeto=0,totalDcto=0;
  results?.forEach((item,idx)=>{
    if(item.manualResolved)return;
    item.alternativas.forEach((alt,ai)=>{const key=idx+"-"+ai;if(!selProd[key]||!alt.p)return;const p=alt.p,m=getMargen(key),d=getDesc(key),dM=getDescM(key),cant=getCant(key,ai===0?(item.cantidad||1):1);const cl=calcLine(p[P.COSTO],m,d,dM,cant);totalNeto+=cl.totalNeto;totalDcto+=cl.descMonto*cant;items.push({sku:p[P.SKU],desc:p[P.DESC],cant,netoUnit:cl.neto,dcto:cl.descPct,dctoMonto:cl.descMonto,totalNeto:cl.totalNeto});});
  });
  // Manual products
  manualProds.forEach((mp,mi)=>{const key="m-"+mi;if(selProd[key]===false)return;const p=mp.p,m=getMargen(key),d=getDesc(key),dM=getDescM(key),cant=getCant(key,mp.cant||1);const cl=calcLine(p[P.COSTO],m,d,dM,cant);totalNeto+=cl.totalNeto;totalDcto+=cl.descMonto*cant;items.push({sku:p[P.SKU],desc:p[P.DESC],cant,netoUnit:cl.neto,dcto:cl.descPct,dctoMonto:cl.descMonto,totalNeto:cl.totalNeto});});
  let csTotalNeto=0,csTotalDcto=0;
  const csItems=crossSell.filter((_,i)=>selCross[i]).map(cs=>{const ci=crossSell.indexOf(cs),p=cs.p,m=getCsMargen(ci),d=getCsDesc(ci),dM=getCsDescM(ci),cant=getCsCant(ci);const cl=calcLine(p[P.COSTO],m,d,dM,cant);csTotalNeto+=cl.totalNeto;csTotalDcto+=cl.descMonto*cant;return{sku:p[P.SKU],desc:p[P.DESC],cant,netoUnit:cl.neto,dcto:cl.descPct,dctoMonto:cl.descMonto,totalNeto:cl.totalNeto,razon:cs.razon||""};});
  // v1.2 — Descuento global
  const subAntesDescGlobal=totalNeto+csTotalNeto;
  const descGlobalMonto=descGlobalM!==null?descGlobalM:Math.round(subAntesDescGlobal*descGlobalPct/100);
  const descGlobalPctEff=subAntesDescGlobal>0?Math.round(descGlobalMonto/subAntesDescGlobal*1000)/10:0;
  return{items,csItems,totalNeto,totalDcto,totalIva:Math.round(totalNeto*(1+IVA)),csTotalNeto,csTotalDcto,descGlobalMonto,descGlobalPctEff,subAntesDescGlobal};
}

// ── Handle file/photo uploads ──
async function handleClientFile(e){
  const f=e.target.files[0];if(!f)return;
  if(f.name.endsWith(".csv")||f.name.endsWith(".txt")){clientText=await f.text();render();return;}
  busy=true;stepText="Leyendo archivo...";render();
  const buf=await f.arrayBuffer();
  const b64=btoa(new Uint8Array(buf).reduce((s,b)=>s+String.fromCharCode(b),""));
  const extracted=await askClaude("Extrae todos los productos/items de este archivo. Lista cada producto en línea separada con toda la info. Responde SOLO la lista.",
    [{type:"document",source:{type:"base64",media_type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",data:b64}},{type:"text",text:"Extrae los productos."}]);
  clientText=extracted;busy=false;stepText="";render();
}

async function handlePhoto(e){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    photoPreview=ev.target.result;
    const b64=ev.target.result.split(",")[1];
    busy=true;stepText="Analizando imagen...";render();
    const extracted=await askClaude("Esta imagen contiene productos de ferretería/construcción. Extrae TODOS, uno por línea, con cantidades. Responde SOLO la lista.",
      [{type:"image",source:{type:"base64",media_type:f.type,data:b64}},{type:"text",text:"Extrae productos."}]);
    clientText=extracted;busy=false;stepText="";render();
  };
  reader.readAsDataURL(f);
}

// ── Admin: update catalog ──
async function updateCatalog(e){
  const f=e.target.files[0];if(!f)return;
  try{
    const text=await f.text();
    const data=JSON.parse(text);
    products=data;
    localStorage.setItem("ov_prods",JSON.stringify(data));
    localStorage.setItem("ov_prods_ver",new Date().toISOString());
    alert(`✅ Catálogo actualizado: ${data.length} productos`);
    showAdmin=false;render();
  }catch(err){alert("Error: "+err.message);}
}

// ── Login ──
function doLogin(){
  const u=document.getElementById("loginUser")?.value?.trim();
  const p=document.getElementById("loginPass")?.value?.trim();
  if(!u||!p){loginError="Ingresa usuario y contraseña";render();return;}
  const found=USERS.find(x=>x.user.toLowerCase()===u.toLowerCase()&&x.pass===p);
  if(!found){loginError="Usuario o contraseña incorrectos";render();return;}
  currentUser=found;
  vendedor=found.user;
  localStorage.setItem("ov_vendedor",found.user);
  sessionStorage.setItem("ov_user",JSON.stringify(found));
  loginError="";
  logAccess(found);
  render();
}
