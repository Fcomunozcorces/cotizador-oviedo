<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador Oviedo Ferreterías</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23FF0A00'/><text x='16' y='22' font-size='18' font-weight='900' text-anchor='middle' fill='white'>O</text></svg>">
<style>
:root{--red:#FF0A00;--black:#000;--dark:#1a1a1a;--gray:#666;--lightgray:#f5f5f5;--border:#e5e5e5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:#f8f8f8;color:var(--dark);direction:ltr;text-align:left}
.header{background:#fff;border-bottom:3px solid var(--red);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px #0001;flex-wrap:wrap;gap:8px}
.header img{height:42px}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;color:var(--gray);background:var(--lightgray);padding:3px 10px;border-radius:6px}
input[type=text],input[type=number],input[type=password]{padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;direction:ltr;text-align:left}
input[type=text]:focus,input[type=number]:focus{outline:2px solid var(--red);border-color:transparent}
textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;line-height:1.5}
textarea:focus{outline:2px solid var(--red);border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff}
.btn-black{background:var(--black);color:#fff}
.btn-ghost{background:#fff;color:var(--dark);border:1px solid var(--border)}
.btn-green{background:#16a34a;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.card-body{padding:16px 20px}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 0;border:none;background:transparent;color:var(--gray);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.tab.active{color:var(--red);border-bottom:2px solid var(--red);background:#fff5f5}
.drop-area{padding:30px;text-align:center;border:2px dashed var(--border);border-radius:8px;background:var(--lightgray)}
table{width:100%;border-collapse:collapse}
th{background:var(--black);color:#fff;padding:9px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;text-align:left;white-space:nowrap}
th.r{text-align:right}
th.c{text-align:center}
td{padding:7px 10px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:top}
td.r{text-align:right;font-family:'Courier New',monospace;white-space:nowrap}
td.c{text-align:center}
td.mono{font-family:'Courier New',monospace;font-size:11px;color:var(--gray)}
tr.alt{background:var(--lightgray)}
tr.sel{background:#fff5f5}
tr.clickable{cursor:pointer;transition:background .1s}
tr.clickable:hover{background:#fef2f2}
tr.no-match{background:#fef2f2}
.conf{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
.conf-alta{background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0}
.conf-media{background:#fef9c3;color:#ca8a04;border:1px solid #fde68a}
.conf-baja{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
.note{font-size:10px;color:var(--gray);margin-top:3px;line-height:1.2}
.total-row{background:var(--red)}
.total-row td{color:#fff;font-weight:800;font-size:14px;padding:10px}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cs-card{padding:14px;background:var(--lightgray);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .15s;position:relative}
.cs-card.selected{border:2px solid var(--red);background:#fff5f5}
.cs-card .check{position:absolute;top:8px;right:10px;font-size:16px;color:var(--red)}
.export-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:20px 0}
.container{max-width:1100px;margin:0 auto;padding:16px 20px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.step-text{font-size:13px;margin-left:8px}
.margen-ctrl{display:flex;align-items:center;gap:6px}
.margen-ctrl label{font-size:13px;color:var(--gray)}
.margen-ctrl input{width:62px;text-align:center;font-weight:700;font-size:15px;color:var(--red)}
.admin-overlay{position:fixed;inset:0;background:#000a;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.admin-panel{background:#fff;border-radius:14px;padding:28px;max-width:500px;width:100%;box-shadow:0 20px 60px #0003}
.stat{text-align:center}.stat-num{font-size:24px;font-weight:800;color:var(--red)}.stat-label{font-size:11px;color:var(--gray)}
.hist-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.photo-preview{max-height:160px;border-radius:8px;margin-bottom:12px}
.section-marker{width:4px;height:18px;background:var(--red);border-radius:2px;display:inline-block;margin-right:8px;vertical-align:middle}
/* PDF view */
.pdf-overlay{position:fixed;inset:0;z-index:200;background:#fff;overflow-y:auto}
.pdf-toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:3px solid var(--red);box-shadow:0 2px 8px #0001}
.pdf-body{max-width:800px;margin:0 auto;padding:24px 28px}
@media(max-width:600px){.header{padding:10px 12px}.container{padding:12px}.card-body{padding:12px}th,td{padding:5px 6px;font-size:10px}}
@media print{.pdf-toolbar{display:none!important}.pdf-body{padding:20px!important}}
</style>
</head>

// ── Helpers ──
const norm = t => (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").trim();
const tokenize = t => norm(t).split(/\s+/).filter(w=>w.length>1);
const fmt = n => `$${Math.round(n).toLocaleString("es-CL")}`;
const pNet = (c,m) => Math.round(c/(1-m/100));
const pIva = (c,m) => Math.round(pNet(c,m)*(1+IVA));
const getMargen = (key) => rowMargen[key]!==undefined?rowMargen[key]:margen;
const getCsMargen = (i) => csMargen[i]!==undefined?csMargen[i]:margen;
const getDesc = (key) => rowDesc[key]||0;
const getDescM = (key) => rowDescM[key]!==undefined?rowDescM[key]:null;
const getCsDesc = (i) => csDesc[i]||0;
const getCsDescM = (i) => csDescM[i]!==undefined?csDescM[i]:null;
const getCant = (key,def) => rowCant[key]!==undefined?rowCant[key]:def;
const getCsCant = (i) => csCant[i]!==undefined?csCant[i]:1;
// calcLine: if descMontoFixed is set, use it; otherwise use desc%
const calcLine = (costo,m,descPct,descMontoFixed,cant) => {
  const neto=pNet(costo,m);
  const descMonto=descMontoFixed!==null?descMontoFixed:Math.round(neto*descPct/100);
  const descPctEff=neto>0?Math.round(descMonto/neto*100*10)/10:0;
  const netoFinal=neto-descMonto;
  const iva=Math.round(netoFinal*(1+IVA));
  return {neto,descPct:descPctEff,descMonto,netoFinal,iva,totalNeto:netoFinal*cant,totalIva:iva*cant};
};
const P = {SKU:0,DESC:1,MARCA:2,COSTO:3,FAM:4,SUBFAM:5};

function scoreMatch(p,tokens){
  const txt=norm(`${p[1]} ${p[2]} ${p[4]} ${p[5]}`);
  const words=txt.split(/\s+/);
  let score=0,matched=0;
  for(const tk of tokens){if(txt.includes(tk)){matched++;score+=words.includes(tk)?3:1;if(norm(p[1]).includes(tk))score+=2;}}
  return matched>=Math.ceil(tokens.length*0.25)?score*(matched/tokens.length):0;
}

function localSearch(query,max=20){
  const tokens=tokenize(query);
  if(!tokens.length)return[];
  return products.map(p=>[p,scoreMatch(p,tokens)]).filter(([,s])=>s>0).sort((a,b)=>b[1]-a[1]).slice(0,max).map(([p])=>p);
}

// Quick search for add-product (also matches SKU directly)
function quickSearch(query,max=8){
  if(!query||query.length<2)return[];
  const q=query.trim();
  // Exact SKU match first
  const skuMatch=products.filter(p=>String(p[P.SKU]).toLowerCase()===q.toLowerCase());
  if(skuMatch.length)return skuMatch.slice(0,max);
  // SKU starts with
  const skuStarts=products.filter(p=>String(p[P.SKU]).toLowerCase().startsWith(q.toLowerCase())).slice(0,3);
  // Text search
  const textResults=localSearch(q,max);
  // Merge, dedupe
  const seen=new Set();
  const merged=[];
  for(const p of [...skuStarts,...textResults]){
    if(!seen.has(p[P.SKU])){seen.add(p[P.SKU]);merged.push(p);}
    if(merged.length>=max)break;
  }
  return merged;
}

function addManualProduct(prod){
  manualProds.push({p:prod,cant:1});
  // Auto-select it
  const key="m-"+(manualProds.length-1);
  selProd[key]=true;
  addSearch="";addResults=[];
  render();
}

function removeManualProduct(idx){
  const key="m-"+idx;
  delete selProd[key];delete rowMargen[key];delete rowDesc[key];delete rowDescM[key];delete rowCant[key];
  manualProds.splice(idx,1);
  // Re-index keys for products after this one
  const newSelProd={},newRowMargen={},newRowDesc={},newRowCant={};
  Object.entries(selProd).forEach(([k,v])=>{
    if(k.startsWith("m-")){const i=+k.split("-")[1];if(i>idx)newSelProd["m-"+(i-1)]=v;else if(i<idx)newSelProd[k]=v;}else newSelProd[k]=v;
  });
  Object.entries(rowMargen).forEach(([k,v])=>{
    if(k.startsWith("m-")){const i=+k.split("-")[1];if(i>idx)newRowMargen["m-"+(i-1)]=v;else if(i<idx)newRowMargen[k]=v;}else newRowMargen[k]=v;
  });
  Object.entries(rowDesc).forEach(([k,v])=>{
    if(k.startsWith("m-")){const i=+k.split("-")[1];if(i>idx)newRowDesc["m-"+(i-1)]=v;else if(i<idx)newRowDesc[k]=v;}else newRowDesc[k]=v;
  });
  Object.entries(rowCant).forEach(([k,v])=>{
    if(k.startsWith("m-")){const i=+k.split("-")[1];if(i>idx)newRowCant["m-"+(i-1)]=v;else if(i<idx)newRowCant[k]=v;}else newRowCant[k]=v;
  });
  selProd=newSelProd;rowMargen=newRowMargen;rowDesc=newRowDesc;rowCant=newRowCant;
  render();
}

// ── Claude API ──
async function askClaude(system,user){
  const r=await fetch("/.netlify/functions/claude",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:API_MODEL,max_tokens:4000,system,messages:[{role:"user",content:typeof user==="string"?user:user}]})
  });
  const d=await r.json();
  if(d.error){alert("API Error: "+d.error.message);return"";}
  return(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}

function parseJSON(raw){
  try{return JSON.parse(raw.replace(/```json\s*/g,"").replace(/```/g,"").trim());}catch{return null;}
}

async function loadProducts(){
  // Try localStorage first
  const cached=localStorage.getItem("ov_prods_ver");
  if(cached){
    try{
      products=JSON.parse(localStorage.getItem("ov_prods"));
      if(products&&products.length>0){render();return;}
    }catch{}
  }
  // Fetch from products.json
  try{
    const r=await fetch("products.json");
    const data=await r.json();
    products=data;
    localStorage.setItem("ov_prods",JSON.stringify(data));
    localStorage.setItem("ov_prods_ver",new Date().toISOString());
  }catch(e){console.error("No products.json found",e);}
  render();
}

async function processQuote(){
  if(!clientText.trim()||busy)return;
  busy=true;results=null;crossSell=[];sel={};selCross={};selProd={};rowMargen={};rowDesc={};rowDescM={};rowCant={};csMargen={};csDesc={};csDescM={};csCant={};manualProds=[];addSearch="";addResults=[];render();

  try{
    stepText="Identificando productos...";render();
    const parsed=parseJSON(await askClaude("Extrae cada producto del texto. JSON sin markdown: [{\"item\":\"desc\",\"cantidad\":n_or_null}]",clientText));
    const items=parsed||clientText.split("\n").filter(l=>l.trim()).map(l=>({item:l.trim(),cantidad:null}));

    stepText=`Buscando en catálogo (${items.length} productos)...`;render();
    const candidates=items.map(ci=>localSearch(ci.item,15));

    stepText="Análisis con IA...";render();
    const matchPrompt=`Eres asistente de cotización de Ferretería Oviedo (Chile).
Para cada producto del cliente, selecciona 1-3 mejores alternativas del catálogo.
Considera medidas, materiales, marcas y specs. Si no hay match razonable, sin_match:true.
RESPONDE SOLO JSON (sin markdown):
[{"cliente_item":"...", "cantidad":n, "alternativas":[{"sku":"...","confianza":"alta|media|baja","nota":"..."}], "sin_match":false}]`;

    const matchUser=`PRODUCTOS DEL CLIENTE:\n${items.map((it,i)=>`${i+1}. ${it.cantidad?it.cantidad+"x ":""}${it.item}`).join("\n")}\n\nCANDIDATOS:\n${candidates.map((cs,i)=>`\n--- #${i+1}: "${items[i].item}" ---\n${cs.map(c=>`SKU:${c[P.SKU]} | ${c[P.DESC]} | ${c[P.MARCA]} | ${c[P.FAM]} | $${c[P.COSTO]}`).join("\n")}`).join("\n")}`;

    const matches=parseJSON(await askClaude(matchPrompt,matchUser));
    if(!matches){alert("Error en análisis. Reintente.");busy=false;stepText="";render();return;}

    results=matches.map(m=>({...m,alternativas:(m.alternativas||[]).map(a=>{const prod=products.find(p=>p[P.SKU]===a.sku);return prod?{...a,p:prod}:null;}).filter(Boolean)}));
    results.forEach((it,i)=>{if(it.alternativas.length){sel[i]=0;selProd[i+"-0"]=true;}});

    // Cross-sell
    stepText="Generando sugerencias...";render();
    const matched=results.flatMap(it=>it.alternativas.map(a=>a.p)).filter(Boolean);
    if(matched.length){
      const matchedSkus=new Set(matched.map(p=>p[P.SKU]));
      const matchedFams=[...new Set(matched.map(p=>p[P.FAM]))];
      const RELATED={"GASFITERIA":["SILICONAS Y SELLANTES","GRIFERIA","FIJACIONES","HERRAMIENTAS MANUALES"],"PINTURA":["HERRAMIENTAS MANUALES","SILICONAS Y SELLANTES","CINTAS ADHESIVAS","QUIMICOS Y PEGAMENTOS"],"ILUMINACION Y ELECTRICIDAD":["HERRAMIENTAS MANUALES","FIJACIONES","CINTAS ADHESIVAS"],"HERRAMIENTAS ELECTRICAS":["ACCESORIOS PARA HERRAMIENTAS","SEGURIDAD","FIJACIONES"],"HERRAMIENTAS INALAMBRICAS":["ACCESORIOS PARA HERRAMIENTAS","SEGURIDAD","FIJACIONES"],"FIJACIONES":["HERRAMIENTAS MANUALES","HERRAMIENTAS ELECTRICAS","SILICONAS Y SELLANTES"],"TABIQUERIA Y REVESTIMIENTO":["FIJACIONES","PINTURA","HERRAMIENTAS MANUALES","SILICONAS Y SELLANTES"],"PISOS":["SILICONAS Y SELLANTES","QUIMICOS Y PEGAMENTOS","HERRAMIENTAS MANUALES"],"C. MATERIALES CONSTRUCCION":["FIJACIONES","HERRAMIENTAS MANUALES","HERRAMIENTAS CONSTRUCCION","SEGURIDAD"],"HERRAMIENTAS MANUALES":["SEGURIDAD","FIJACIONES","HERRAMIENTAS ELECTRICAS"],"SEGURIDAD":["HERRAMIENTAS MANUALES","HERRAMIENTAS ELECTRICAS"],"HERRAMIENTAS CONSTRUCCION":["SEGURIDAD","FIJACIONES","C. MATERIALES CONSTRUCCION"],"SOLDADORAS":["SEGURIDAD","ACCESORIOS PARA HERRAMIENTAS"],"TECHUMBRE Y AISLACION":["FIJACIONES","SILICONAS Y SELLANTES","HERRAMIENTAS MANUALES"],"GRIFERIA":["GASFITERIA","SILICONAS Y SELLANTES"],"ACCESORIOS PARA HERRAMIENTAS":["HERRAMIENTAS ELECTRICAS","HERRAMIENTAS INALAMBRICAS","SEGURIDAD"],"C. MATERIALES FERRETERIA":["FIJACIONES","HERRAMIENTAS MANUALES","SEGURIDAD"],"QUINCALLERIA Y CERRAJERIA":["HERRAMIENTAS MANUALES","FIJACIONES"],"HOGAR":["PINTURA","ILUMINACION Y ELECTRICIDAD"],"BOMBAS Y MOTORES":["GASFITERIA","HERRAMIENTAS MANUALES"],"GENERADORES Y COMPRESORES":["ACCESORIOS PARA HERRAMIENTAS","SEGURIDAD"]};
      const relFams=new Set();matchedFams.forEach(f=>(RELATED[f]||[]).forEach(r=>relFams.add(r)));
      // Fallback: if no related families found, suggest from SEGURIDAD + HERRAMIENTAS MANUALES
      if(relFams.size===0){relFams.add("SEGURIDAD");relFams.add("HERRAMIENTAS MANUALES");relFams.add("FIJACIONES");}
      const csCands=products.filter(p=>!matchedSkus.has(p[P.SKU])&&relFams.has(p[P.FAM])).slice(0,60);
      if(csCands.length){
        const cs=parseJSON(await askClaude("Eres experto en ventas de ferretería en Chile. Sugiere 3-6 complementarios para cross-selling. JSON sin markdown: [{\"sku\":\"...\",\"razon\":\"...\"}]",
          `COMPRANDO:\n${matched.map(p=>`- ${p[P.DESC]} (${p[P.FAM]})`).join("\n")}\n\nDISPONIBLE:\n${csCands.map(p=>`SKU:${p[P.SKU]} | ${p[P.DESC]} | ${p[P.FAM]} | $${p[P.COSTO]}`).join("\n")}`));
        if(cs)crossSell=cs.map(x=>{const prod=products.find(p=>p[P.SKU]===x.sku);return prod?{...x,p:prod}:null;}).filter(Boolean);
      }
    }

    // Save history
    const entry={id:Date.now(),fecha:new Date().toLocaleString("es-CL"),vendedor,input:clientText.substring(0,150),items:results.length,matched:results.filter(e=>e.alternativas.length>0).length};
    hist=[entry,...hist].slice(0,50);
    localStorage.setItem("ov_hist",JSON.stringify(hist));

  }catch(err){console.error(err);alert("Error: "+err.message);}
  busy=false;stepText="";render();
}

  rows.push([]);rows.push(["","","","","","","","SUBTOTAL NETO:",tN]);

    selCS.forEach(cs=>{const p=cs.p,ci=crossSell.indexOf(cs),m=getCsMargen(ci),d=getCsDesc(ci),dM=getCsDescM(ci),cant=getCsCant(ci);const cl=calcLine(p[P.COSTO],m,d,dM,cant);csTotal+=cl.totalNeto;
      rows.push([String(p[P.SKU]),p[P.DESC],cant,Math.round(p[P.COSTO]),m/100,cl.neto,cl.descPct/100,cl.descMonto*cant,cl.totalNeto]);});

ago · Las Cabras · San Vicente · El Manzano · Litueche</div></div></div></div><div style="height:6px;background:#000"></div><div style="height:3px;background:#FF0A00"></div><script>window.onload=function(){window.print()}<\/script></body></html>`;

function buildPDFData(){
  const items=[];let totalNeto=0,totalDcto=0;
  results?.forEach((item,idx)=>{item.alternativas.forEach((alt,ai)=>{const key=idx+"-"+ai;if(!selProd[key]||!alt.p)return;const p=alt.p,m=getMargen(key),d=getDesc(key),dM=getDescM(key),cant=getCant(key,ai===0?(item.cantidad||1):1);const cl=calcLine(p[P.COSTO],m,d,dM,cant);totalNeto+=cl.totalNeto;totalDcto+=cl.descMonto*cant;items.push({sku:p[P.SKU],desc:p[P.DESC],cant,netoUnit:cl.neto,dcto:cl.descPct,dctoMonto:cl.descMonto,totalNeto:cl.totalNeto});});});
  // Manual products
  manualProds.forEach((mp,mi)=>{const key="m-"+mi;if(selProd[key]===false)return;const p=mp.p,m=getMargen(key),d=getDesc(key),dM=getDescM(key),cant=getCant(key,mp.cant||1);const cl=calcLine(p[P.COSTO],m,d,dM,cant);totalNeto+=cl.totalNeto;totalDcto+=cl.descMonto*cant;items.push({sku:p[P.SKU],desc:p[P.DESC],cant,netoUnit:cl.neto,dcto:cl.descPct,dctoMonto:cl.descMonto,totalNeto:cl.totalNeto});});
  let csTotalNeto=0,csTotalDcto=0;
  const csItems=crossSell.filter((_,i)=>selCross[i]).map(cs=>{const ci=crossSell.indexOf(cs),p=cs.p,m=getCsMargen(ci),d=getCsDesc(ci),dM=getCsDescM(ci),cant=getCsCant(ci);const cl=calcLine(p[P.COSTO],m,d,dM,cant);csTotalNeto+=cl.totalNeto;csTotalDcto+=cl.descMonto*cant;return{sku:p[P.SKU],desc:p[P.DESC],cant,netoUnit:cl.neto,dcto:cl.descPct,dctoMonto:cl.descMonto,totalNeto:cl.totalNeto,razon:cs.razon||""};});
  return{items,csItems,totalNeto,totalDcto,totalIva:Math.round(totalNeto*(1+IVA)),csTotalNeto,csTotalDcto};
}

// ── Handle file/photo uploads ──
async function handleClientFile(e){
  const f=e.target.files[0];if(!f)return;
  if(f.name.endsWith(".csv")||f.name.endsWith(".txt")){clientText=await f.text();render();return;}
  busy=true;stepText="Leyendo archivo...";render();
  const buf=await f.arrayBuffer();
  const b64=btoa(new Uint8Array(buf).reduce((s,b)=>s+String.fromCharCode(b),""));
  const extracted=await askClaude("Extrae todos los productos/items de este archivo. Lista cada producto en línea separada con toda la info. Responde SOLO la lista.",
    [{type:"document",source:{type:"base64",media_type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",data:b64}},{type:"text",text:"Extrae los productos."}]);
  clientText=extracted;busy=false;stepText="";render();
}

async function handlePhoto(e){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    photoPreview=ev.target.result;
    const b64=ev.target.result.split(",")[1];
    busy=true;stepText="Analizando imagen...";render();
    const extracted=await askClaude("Esta imagen contiene productos de ferretería/construcción. Extrae TODOS, uno por línea, con cantidades. Responde SOLO la lista.",
      [{type:"image",source:{type:"base64",media_type:f.type,data:b64}},{type:"text",text:"Extrae productos."}]);
    clientText=extracted;busy=false;stepText="";render();
  };
  reader.readAsDataURL(f);
}

// ── Admin: update catalog ──
async function updateCatalog(e){
  const f=e.target.files[0];if(!f)return;
  try{
    const text=await f.text();
    const data=JSON.parse(text);
    products=data;
    localStorage.setItem("ov_prods",JSON.stringify(data));
    localStorage.setItem("ov_prods_ver",new Date().toISOString());
    alert(`✅ Catálogo actualizado: ${data.length} productos`);
    showAdmin=false;render();
  }catch(err){alert("Error: "+err.message);}
}

        <td class="r" style="font-size:11px">${fmt(cl.neto)}</td>
        <td class="r"><input type="number" dir="ltr" inputmode="decimal" value="${Math.round(cl.descPct*10)/10}" onchange="rowDesc['${key}']=+this.value;delete rowDescM['${key}'];render()" onclick="event.stopPropagation()" min="0" max="99" style="width:42px;text-align:center;font-size:12px;padding:3px;border:1px solid var(--border);border-radius:4px"></td>
        <td class="r"><input type="number" dir="ltr" inputmode="decimal" value="${cl.descMonto}" onchange="rowDescM['${key}']=+this.value;delete rowDesc['${key}'];render()" onclick="event.stopPropagation()" min="0" style="width:60px;text-align:center;font-size:11px;padding:3px;border:1px solid var(--border);border-radius:4px;color:${cl.descMonto>0?'var(--red)':'var(--gray)'}"></td>
        <td class="r" style="font-weight:700">${fmt(cl.totalNeto)}</td>
      </tr>`;
    });

    // Add product search bar
    h+=`<tr style="background:#f8fffe;border-bottom:1px solid var(--border)"><td colspan="10" style="padding:8px 10px;position:relative">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="color:#16a34a;font-weight:700;font-size:13px">+</span>
        <input type="text" id="addProdSearch" value="${addSearch}" oninput="addSearch=this.value;addResults=quickSearch(this.value);updateSearchDropdown()" onkeydown="if(event.key==='Escape'){addSearch='';addResults=[];render()}" placeholder="Agregar producto: busca por SKU o descripción..." style="flex:1;border:1px solid #bbf7d0;background:#f0fdf4">
        ${addSearch?`<button onclick="addSearch='';addResults=[];render()" style="border:none;background:none;color:var(--gray);cursor:pointer;font-size:14px">✕</button>`:''}
      </div>
      <div id="searchDropdown" style="position:absolute;left:10px;right:10px;top:42px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px #0002;z-index:20;max-height:280px;overflow-y:auto;display:${addResults.length?'block':'none'}">
        ${addResults.map(p=>`<div onclick="addManualProduct(products.find(x=>String(x[0])==='${String(p[P.SKU]).replace(/'/g,"\\'")}'))" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;display:flex;justify-content:space-between;align-items:center" onmouseover="this.style.background='#f0fdf4'" onmouseout="this.style.background='#fff'"><div><span class="mono" style="color:var(--red);font-size:11px;margin-right:8px">${p[P.SKU]}</span><span style="font-size:12px">${p[P.DESC]}</span><span style="font-size:10px;color:var(--gray);margin-left:8px">${p[P.MARCA]}</span></div><span style="font-size:12px;font-weight:600;white-space:nowrap">${fmt(p[P.COSTO])}</span></div>`).join("")}
      </div>
    </td></tr>`;

    // Subtotal with weighted margin
    const margenPond=tNetoFinal>0?Math.round((1-tCosto/tNetoFinal)*100):0;
    h+=`<tr style="background:var(--lightgray)">
      <td colspan="4" style="text-align:right;font-weight:700;color:var(--gray);padding:10px;font-size:12px">Subtotal productos:</td>
      <td class="r" style="font-size:11px;color:var(--gray)">${fmt(tCosto)}</td>
      <td class="r" style="font-weight:700;color:var(--red);font-size:12px">${margenPond}%</td>
      <td class="r" style="font-size:11px">${fmt(tNeto)}</td>
      <td></td>
      <td class="r" style="font-size:11px;color:var(--red)">${tNeto>0?Math.round(tDcto/tNeto*1000)/10+'%':'-'}</td>
      <td class="r" style="font-size:11px;color:var(--red)">${tDcto>0?'-'+fmt(tDcto):'-'}</td>
      <td class="r" style="font-weight:800;font-size:13px">${fmt(tNetoFinal)}</td>
    </tr>`;
    h+=`</tbody></table></div>`;

    // Cross-sell — same table format as products
    if(crossSell.length){
      const selCount=Object.values(selCross).filter(Boolean).length;
      let csNetoTotal=0,csCosto=0,csNeto=0,csDcto=0;

      h+=`<div class="card" style="overflow-x:auto"><div class="card-head" style="background:var(--lightgray)"><span><span class="section-marker"></span>🔥 Potencia tu compra con estos descuentos especiales</span><span style="color:var(--red);font-size:12px">${selCount} seleccionados</span></div>
        <table style="min-width:1000px"><thead><tr>
          <th>Descripción</th><th style="width:55px">Cant</th><th>SKU</th><th class="r">Costo</th><th class="r" style="width:60px">Margen</th><th class="r">P.Neto</th><th class="r" style="width:55px">Dcto %</th><th class="r">Dcto $</th><th class="r">Total Neto</th>
        </tr></thead><tbody>`;
      crossSell.forEach((cs,i)=>{
        const isSel=!!selCross[i],p=cs.p;
        const m=getCsMargen(i),d=getCsDesc(i),dM=getCsDescM(i),cant=getCsCant(i);
        const cl=calcLine(p[P.COSTO],m,d,dM,cant);
        if(isSel){csNetoTotal+=cl.totalNeto;csCosto+=p[P.COSTO]*cant;csNeto+=cl.neto*cant;csDcto+=cl.descMonto*cant;}
        h+=`<tr class="clickable" style="${isSel?'background:#fff5f5;':''}border-bottom:1px solid var(--border);transition:background .15s">
          <td style="cursor:pointer;max-width:220px" onclick="selCross[${i}]=!selCross[${i}];render()">${isSel?'<span style="color:var(--red);font-weight:700;margin-right:4px">✓</span>':''}<span style="font-size:12px;font-weight:500">${p[P.DESC]}</span>${cs.razon?'<div class="note" style="margin-top:2px">'+cs.razon+'</div>':''}</td>
          <td><input type="number" dir="ltr" inputmode="decimal" value="${cant}" onchange="csCant[${i}]=+this.value;render()" onclick="event.stopPropagation()" min="1" style="width:45px;text-align:center;font-size:12px;padding:3px;border:1px solid var(--border);border-radius:4px"></td>
          <td class="mono" style="color:var(--red);font-size:11px">${p[P.SKU]}</td>
          <td class="r" style="font-size:11px;color:var(--gray)">${fmt(p[P.COSTO])}</td>
          <td class="r"><input type="number" dir="ltr" inputmode="decimal" value="${m}" onchange="csMargen[${i}]=+this.value;render()" onclick="event.stopPropagation()" min="0" max="80" style="width:45px;text-align:center;font-size:12px;font-weight:700;color:var(--red);padding:3px;border:1px solid var(--border);border-radius:4px"></td>
          <td class="r" style="font-size:11px">${fmt(cl.neto)}</td>
          <td class="r"><input type="number" dir="ltr" inputmode="decimal" value="${Math.round(cl.descPct*10)/10}" onchange="csDesc[${i}]=+this.value;delete csDescM[${i}];render()" onclick="event.stopPropagation()" min="0" max="99" style="width:42px;text-align:center;font-size:12px;padding:3px;border:1px solid var(--border);border-radius:4px"></td>
          <td class="r"><input type="number" dir="ltr" inputmode="decimal" value="${cl.descMonto}" onchange="csDescM[${i}]=+this.value;delete csDesc[${i}];render()" onclick="event.stopPropagation()" min="0" style="width:60px;text-align:center;font-size:11px;padding:3px;border:1px solid var(--border);border-radius:4px;color:${cl.descMonto>0?'var(--red)':'var(--gray)'}"></td>
          <td class="r" style="font-weight:700">${fmt(cl.totalNeto)}</td>
        </tr>`;
      });
      if(selCount>0){
        const csDctoPct=csNeto>0?Math.round(csDcto/csNeto*1000)/10:0;
        h+=`<tr style="background:var(--lightgray)">
          <td colspan="3" style="text-align:right;font-weight:700;color:var(--gray);font-size:12px;padding:8px 10px">Subtotal complementarios:</td>
          <td class="r" style="font-size:11px;color:var(--gray)">${fmt(csCosto)}</td><td></td>
          <td class="r" style="font-size:11px">${fmt(csNeto)}</td>
          <td class="r" style="font-size:11px;color:var(--red)">${csDctoPct}%</td>
          <td class="r" style="font-size:11px;color:var(--red)">${csDcto>0?'-'+fmt(csDcto):'-'}</td>
          <td class="r" style="font-weight:700">${fmt(csNetoTotal)}</td>
        </tr>`;
      }
      h+=`</tbody></table></div>`;

      // Grand total
      if(selCount>0){
        const grandNeto=tNetoFinal+csNetoTotal;
        const grandCosto=tCosto+csCosto;
        const grandIva=Math.round(grandNeto*(1+IVA));
        const grandMargen=grandNeto>0?Math.round((1-grandCosto/grandNeto)*100):0;
        h+=`<div class="card" style="border:2px solid var(--red)"><div style="padding:16px 20px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
            <div><span style="font-weight:800;font-size:15px">TOTAL GENERAL</span><span style="font-size:12px;color:var(--gray);margin-left:8px">(productos + complementarios)</span></div>
            <div style="display:flex;gap:24px;align-items:baseline">
              <div><span style="font-size:11px;color:var(--gray)">Margen: </span><span style="font-weight:700;color:var(--red)">${grandMargen}%</span></div>
              <div><span style="font-size:11px;color:var(--gray)">Neto: </span><span style="font-weight:700;font-size:16px">${fmt(grandNeto)}</span></div>
              <div><span style="font-size:11px;color:var(--gray)">c/IVA: </span><span style="font-weight:900;font-size:22px;color:var(--red)">${fmt(grandIva)}</span></div>
            </div>
          </div>
        </div></div>`;
      }
    }

    // No cross-sell: show simple total
    if(!crossSell.length||!Object.values(selCross).filter(Boolean).length){
      const totalIva=Math.round(tNetoFinal*(1+IVA));
      h+=`<div class="card" style="border:2px solid var(--red)"><div style="padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div><span style="font-weight:800;font-size:15px">TOTAL</span></div>
        <div style="display:flex;gap:24px;align-items:baseline">
          <div><span style="font-size:11px;color:var(--gray)">Margen: </span><span style="font-weight:700;color:var(--red)">${margenPond}%</span></div>
          <div><span style="font-size:11px;color:var(--gray)">Neto: </span><span style="font-weight:700;font-size:16px">${fmt(tNetoFinal)}</span></div>
          <div><span style="font-size:11px;color:var(--gray)">c/IVA: </span><span style="font-weight:900;font-size:22px;color:var(--red)">${fmt(totalIva)}</span></div>
        </div>
      </div></div>`;
    }

    // Export buttons
    h+=`<div class="export-bar">
      <button class="btn btn-green" onclick="exportXLSX()">📥 Excel (selección)</button>
      <button class="btn btn-red" onclick="if(!vendedor.trim()||!clienteNombre.trim()||!clienteRut.trim()){alert('Completa los campos obligatorios: Nombre Cliente, RUT y Vendedor');return;}showPDF=true;render()">📄 PDF Cotización</button>
      <button class="btn btn-ghost" onclick="results=null;crossSell=[];clientText='';photoPreview=null;sel={};selCross={};selProd={};rowMargen={};rowDesc={};rowDescM={};rowCant={};csMargen={};csDesc={};csDescM={};csCant={};manualProds=[];addSearch='';addResults=[];render()">🔄 Nueva Cotización</button>
    </div>`;
  } // close if(results)

  h+=`</div>`; // close container

  // Admin overlay
  if(showAdmin){
    const ver=localStorage.getItem("ov_prods_ver")||"nunca";
    h+=`<div class="admin-overlay" onclick="showAdmin=false;render()">
      <div class="admin-panel" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:16px;font-size:16px">⚙️ Configuración</h3>
        <div style="margin-bottom:16px;padding:16px;background:var(--lightgray);border-radius:8px">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">📦 Actualizar Catálogo</label>
          <div style="font-size:12px;color:var(--gray);margin-bottom:8px">Productos actuales: <b>${products.length.toLocaleString()}</b> · Última actualización: <b>${ver.slice(0,10)}</b></div>
          <label class="btn btn-black" style="font-size:13px">📁 Subir nuevo JSON<input type="file" accept=".json" onchange="updateCatalog(event)" style="display:none"></label>
        </div>
        <button class="btn btn-ghost" onclick="showAdmin=false;render()" style="width:100%">Cerrar</button>
      </div>
    </div>`;
  }

  // PDF overlay
  if(showPDF){
    const pd=buildPDFData();
    const fecha=new Date().toLocaleDateString("es-CL",{day:"2-digit",month:"long",year:"numeric"});
    const grandNeto=pd.totalNeto+pd.csTotalNeto;
    const grandIva=Math.round(grandNeto*(1+IVA));
    h+=`<div class="pdf-overlay">
      <div class="pdf-toolbar">
        <span style="font-weight:700;font-size:13px">Vista previa de Cotización</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-red" onclick="downloadPrintHTML()">📄 Descargar</button>
          <button class="btn btn-black" onclick="showPDF=false;render()">← Volver</button>
        </div>
      </div>
      <div class="pdf-body">
        <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:3px solid var(--red)">
          <img src="${LOGO_B64}" style="height:75px">
          <div style="text-align:right;color:var(--gray);font-size:11px;line-height:1.7">
            <div style="color:#000;font-weight:700;font-size:12px;letter-spacing:1px">COTIZACIÓN</div>
            <div>${fecha}</div><div>Vendedor: <b>${vendedor||"—"}</b></div>
          </div>
        </div>
        <div style="margin:16px 0;padding:12px 14px;background:var(--lightgray);border:1px solid var(--border);border-radius:6px;font-size:11px;line-height:1.8"><b>Cliente:</b> ${clienteNombre} · <b>RUT:</b> ${clienteRut}${clienteEmail?" · <b>Email:</b> "+clienteEmail:""}${clienteTelefono?" · <b>Tel:</b> "+clienteTelefono:""}</div>
        <div style="margin:16px 0 10px"><span class="section-marker"></span><span style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px">Detalle de Productos</span><span style="float:right;font-size:11px;color:var(--gray)">${pd.items.length} items</span></div>
        <table style="border:1px solid var(--border)"><thead><tr><th style="width:11%">SKU</th><th>Descripción</th><th class="c" style="width:6%">Cant.</th><th class="r" style="width:12%">P. Neto</th><th class="r" style="width:10%">Dcto</th><th class="r" style="width:13%">Total Neto</th></tr></thead><tbody>
        ${pd.items.map((it,i)=>`<tr style="background:${i%2===0?"#fff":"#fafafa"}"><td class="mono" style="color:var(--gray)">${it.sku}</td><td style="font-weight:500">${it.desc}</td><td class="c">${it.cant}</td><td class="r">${fmt(it.netoUnit)}</td><td class="r" style="color:${it.dcto>0?"var(--red)":"#999"}">${it.dcto>0?it.dcto+"% (-"+fmt(it.dctoMonto*it.cant)+")":"-"}</td><td class="r" style="font-weight:700">${fmt(it.totalNeto)}</td></tr>`).join("")}
        </tbody></table>
        <table><tr style="background:var(--lightgray)"><td style="text-align:right;font-weight:600;color:var(--gray);width:75%;padding:8px 10px;font-size:12px">Subtotal productos neto:</td><td style="text-align:right;font-weight:700;padding:8px 10px;font-size:13px">${fmt(pd.totalNeto)}</td></tr>${pd.totalDcto>0?`<tr style="background:var(--lightgray)"><td style="text-align:right;font-size:11px;color:var(--red);padding:5px 10px">Descuento productos:</td><td style="text-align:right;font-size:11px;color:var(--red);padding:5px 10px">-${fmt(pd.totalDcto)}</td></tr>`:``}</table>
        ${pd.csItems.length?`<div style="margin-top:24px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="width:4px;height:18px;background:var(--red);border-radius:2px"></div><span style="font-size:13px;font-weight:800;letter-spacing:1px">🔥 Potencia tu compra con estos descuentos especiales</span></div><table><thead><tr><th style="background:#333">SKU</th><th style="background:#333">Descripción</th><th class="c" style="background:#333">Cant.</th><th class="r" style="background:#333">P. Neto</th><th class="r" style="background:#333">Dcto</th><th class="r" style="background:#333">Total Neto</th></tr></thead><tbody>${pd.csItems.map((cs,i)=>`<tr style="background:${i%2===0?"#fff":"#fafafa"}"><td class="mono" style="color:var(--gray)">${cs.sku}</td><td>${cs.desc}${cs.razon?'<div style="font-size:9px;color:#999;font-style:italic;margin-top:2px">'+cs.razon+'</div>':''}</td><td class="c">${cs.cant}</td><td class="r">${fmt(cs.netoUnit||cs.pN)}</td><td class="r" style="color:${cs.dctoMonto>0?'var(--red)':'#999'}">${cs.dctoMonto>0?cs.dcto+'% (-'+fmt(cs.dctoMonto*cs.cant)+')':"-"}</td><td class="r" style="font-weight:600">${fmt(cs.totalNeto)}</td></tr>`).join("")}</tbody></table><table><tr style="background:var(--lightgray)"><td style="text-align:right;font-weight:600;color:var(--gray);width:75%;padding:8px 10px;font-size:12px">Subtotal complementarios neto:</td><td style="text-align:right;font-weight:700;padding:8px 10px;font-size:13px">${fmt(pd.csTotalNeto)}</td></tr>${pd.csTotalDcto>0?`<tr style="background:var(--lightgray)"><td style="text-align:right;font-size:11px;color:var(--red);padding:5px 10px">Descuento complementarios:</td><td style="text-align:right;font-size:11px;color:var(--red);padding:5px 10px">-${fmt(pd.csTotalDcto)}</td></tr>`:``}</table></div>`:""}
        <table style="margin-top:8px"><tr style="background:var(--lightgray)"><td style="text-align:right;font-weight:700;color:var(--gray);width:75%;padding:8px 10px;font-size:12px">Total Neto:</td><td style="text-align:right;font-weight:700;padding:8px 10px;font-size:14px">${fmt(grandNeto)}</td></tr>
        <tr style="background:var(--lightgray)"><td style="text-align:right;font-size:11px;color:var(--gray);padding:6px 10px">IVA 19%:</td><td style="text-align:right;font-size:12px;color:var(--gray);padding:6px 10px">${fmt(grandIva-grandNeto)}</td></tr>
        <tr style="background:var(--red)"><td style="text-align:right;font-weight:800;color:#fff;letter-spacing:1px;padding:12px 14px;font-size:15px">TOTAL c/IVA</td><td style="text-align:right;font-weight:900;color:#fff;font-size:20px;padding:12px 14px">${fmt(grandIva)}</td></tr></table>
        <div style="margin-top:36px;padding-top:14px;border-top:3px solid #000;display:flex;justify-content:space-between">
          <div style="font-size:9px;color:#999;line-height:1.7">Cotización válida por 7 días hábiles.<br>Precios sujetos a disponibilidad de stock.</div>
          <div style="text-align:right"><div style="font-size:11px;font-weight:800;color:var(--red);letter-spacing:1px">WWW.OVIEDO.CL</div><div style="font-size:9px;color:#999;margin-top:2px">Santiago · Las Cabras · San Vicente · El Manzano · Litueche</div></div>
        </div>
      </div>
    </div>`;
  }

  app.innerHTML=h;
}

// ── Init ──
loadProducts();
</script>
</body>
</html>
